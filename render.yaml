services:
  - type: web
    name: gestion-proyectos
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: NEON_MOBILE_DATABASE_URL
        sync: false
      - key: DEBUG
        value: "False"
      - key: ENABLE_INTERNAL_PROXY
        value: "True"
      - key: TRUST_PROXY_HTTPS
        value: "True"
